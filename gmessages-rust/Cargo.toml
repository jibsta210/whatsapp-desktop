[package]
name = "gmessages-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust client for Google Messages Web (relay protocol)"

[features]
default = []

[dependencies]
# Crypto
aes = { workspace = true }
aes-gcm = { workspace = true }
ctr = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

# Encoding
base64 = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
prost = { workspace = true, features = ["derive"] }
prost-reflect = { version = "0.16", features = ["derive"] }
once_cell = "1"

# For event timestamps + dedup
chrono = { workspace = true, features = ["clock"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["v4"] }

# Async / runtime
async-trait = { workspace = true }
futures = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util"] }

# Errors / logging
anyhow = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

# HTTP transport (long-poll + RPC)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate"] }

# ECDSA P-256 for UKEY2
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "std", "arithmetic"] }
elliptic-curve = { version = "0.13", default-features = false, features = ["sec1", "std"] }

[build-dependencies]
prost-build = { workspace = true }
prost-reflect-build = "0.16"

[dev-dependencies]
env_logger = { version = "0.11", default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
qrcode = { version = "0.14", default-features = false }

[[example]]
name = "pair"

[[example]]
name = "listen"

[[example]]
name = "send"

[[example]]
name = "chats"
